name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Types
        run: uv run ty check src tests

      - name: Tests
        run: uv run pytest

      - name: dbt on recorded data
        env:
          DAWRI_DATA_DIR: ${{ runner.temp }}/data
          NO_COLOR: "1"
        run: |
          cp -r tests/fixtures/recorded "$DAWRI_DATA_DIR"
          uv run dawri load
          uv run dbt deps --project-dir dbt --profiles-dir dbt
          uv run dbt build --project-dir dbt --profiles-dir dbt --exclude tag:full_data
