name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
      MISE_DISABLE_TOOLS: "github:rilldata/rill"  # Rill runs locally, not in CI
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: jdx/mise-action@v2

      - name: Data dir
        run: echo "DAWRI_DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"

      - name: Install
        run: |
          uv sync --locked
          uv run dbt deps --project-dir dbt --profiles-dir dbt
          uv run python -c "import duckdb; duckdb.connect().execute('INSTALL ossie FROM community')"

      - name: Lint
        run: uv run ruff check src tests

      - name: Types
        run: uv run ty check src tests

      - name: Tests
        run: uv run pytest

      - name: Web checks
        run: |
          npm ci --prefix web
          mise run web-check
          mise run web-contract

      - name: dbt on recorded data
        run: |
          cp -r tests/fixtures/recorded "$DAWRI_DATA_DIR"
          uv run dawri load
          uv run dbt build --project-dir dbt --profiles-dir dbt --exclude tag:full_data

      - name: Semantic check
        run: mise run semantic-check

      - name: Rill sync check
        run: mise run rill-sync -- --check

      - name: Evidence sync check
        run: mise run evidence-sync -- --check

      - name: App check
        run: mise run app-check
