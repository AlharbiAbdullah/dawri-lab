name: dawri
datasets:
- name: fct_team_matches
  source: '"dawri"."marts"."fct_team_matches"'
  primary_key:
  - team_match_key
  description: ''
  fields:
  - name: team_match
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: team_match_key
    description: ''
  - name: team
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: team_id
    description: ''
  - name: kickoff_utc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kickoff_utc
    dimension:
      is_time: true
  - name: season_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: season_id
    dimension:
      is_time: false
  - name: venue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: venue
    dimension:
      is_time: false
  - name: result
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: result
    dimension:
      is_time: false
metrics:
- name: goal_difference
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(fct_team_matches.goals_for) - SUM(fct_team_matches.goals_against)
- name: goals_against
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(fct_team_matches.goals_against)
- name: goals_for
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(fct_team_matches.goals_for)
- name: matches_played
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(1)
  description: Finished matches
- name: points
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(fct_team_matches.points)
  description: 3 for a win, 1 for a draw
- name: points_per_match
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: (SUM(fct_team_matches.points)) / (SUM(1))
- name: shots
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(fct_team_matches.shots)
- name: shots_on_target
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(fct_team_matches.shots_on_target)
- name: xg_against
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(fct_team_matches.xg_against)
- name: xg_difference
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(fct_team_matches.xg_for) - SUM(fct_team_matches.xg_against)
- name: xg_for
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(fct_team_matches.xg_for)
version: 0.2.0.dev0
