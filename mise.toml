[env]
DAWRI_DATA_DIR = "{{ get_env(name='DAWRI_DATA_DIR', default=config_root ~ '/data') }}"
SEND_ANONYMOUS_USAGE_STATS = "no"  # Evidence telemetry off

[vars]
ossie_py = "apache-ossie @ git+https://github.com/apache/ossie@adfa9e4#subdirectory=python"
ossie_convert = "uvx --from 'git+https://github.com/apache/ossie@adfa9e4#subdirectory=converters/dbt' ossie-dbt msi-to-ossie -i dbt/target/semantic_manifest.json --model-name dawri"

[tasks.ossie]
description = "Regenerate semantic/dawri.ossie.yaml from dbt and validate it"
run = [
  "{{vars.ossie_convert}} -o semantic/dawri.ossie.yaml",
  "uv run scripts/ossie_summary.py semantic/dawri.ossie.yaml",
]

[tasks.semantic-check]
description = "Fail if the Ossie document is stale or the two engines disagree"
run = [
  '''
  set -e
  out=$(mktemp)
  trap 'rm -f "$out"' EXIT
  {{vars.ossie_convert}} -o "$out" > /dev/null
  if cmp -s "$out" semantic/dawri.ossie.yaml; then
    echo "ossie: semantic/dawri.ossie.yaml matches dbt"
  else
    echo "semantic/dawri.ossie.yaml is stale"
    exit 1
  fi
  ''',
  "uv run scripts/parity.py",
]

[tasks.rill-sync]
description = "Regenerate rill/metrics/team_matches.yaml from the Ossie document"
run = "./scripts/rill_sync.py"

[tasks.evidence-sync]
description = "Regenerate evidence/sources/dawri/*.sql from the Ossie document; --check"
run = "uv run --with '{{vars.ossie_py}}' scripts/evidence_sync.py"

[tasks.evidence-parity]
description = "Fail if the Parquet the Evidence build ships disagrees with dawri metrics"
run = "uv run scripts/evidence_parity.py"

[tasks.app-check]
description = "Fail if src/dawri/app.py defines a metric: an aggregate or import duckdb"
run = '''
if grep -nEi '\b(sum|avg|count|min|max)\s*\(|^\s*(import|from)\s+duckdb' src/dawri/app.py; then
  echo "app-check: src/dawri/app.py defines a metric"
  exit 1
fi
echo "app-check: src/dawri/app.py defines no metric"
'''

[tasks.rill-parity]
description = "Fail if Rill's team_metrics API disagrees with dawri metrics (Rill running)"
run = "uv run scripts/rill_parity.py"


[tools]
"github:rilldata/rill" = "0.90.2"
