[env]
DAWRI_DATA_DIR = "{{ get_env(name='DAWRI_DATA_DIR', default=config_root ~ '/data') }}"

[tasks.ossie]
description = "Regenerate semantic/dawri.ossie.yaml from dbt and validate it"
run = [
  "uvx --from 'git+https://github.com/apache/ossie@adfa9e4#subdirectory=converters/dbt' ossie-dbt msi-to-ossie -i dbt/target/semantic_manifest.json -o semantic/dawri.ossie.yaml --model-name dawri",
  "uv run scripts/ossie_summary.py semantic/dawri.ossie.yaml",
]

